<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot AI Pro</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="header-info">
        <h2>Assistente Virtuale</h2>
        <span class="status">Online</span>
      </div>
      <button id="dark-mode-toggle" title="Cambia Tema">🌙</button>
    </div>
    <div class="chat-body" id="chat-body">
      <div class="message bot-message">
        <div class="message-content">
          <p>Ciao! Sono il tuo assistente virtuale. Come posso aiutarti oggi?</p>
        </div>
      </div>
    </div>
    <div class="chat-footer">
      <textarea id="user-input" placeholder="Scrivi un messaggio... (Shift+Enter per andare a capo)" rows="1"></textarea>
      <button id="send-btn">
        <svg fill="currentColor" viewBox="0 0 24 24" width="24" height="24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
      </button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
