<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot AI Semplice</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="header-info">
        <h2>Assistente Virtuale</h2>
        <span class="status">Online</span>
      </div>
      <button id="dark-mode-toggle" title="Cambia Tema">🌙</button>
    </div>
    <div class="chat-body" id="chat-body">
      </div>
    <div class="chat-footer">
      <textarea id="user-input" placeholder="Scrivi un messaggio... (Invio per inviare)" rows="1"></textarea>
      <button id="send-btn">Invia</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
