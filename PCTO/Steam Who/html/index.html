<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEAM Who? - Home</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../img/genio.png">
</head>
<body>

<canvas id="particles"></canvas>

<!-- Barra di navigazione -->
<nav class="navbar">
    <div class="dropdown">
        <button class="dropbtn">Menu ☰</button>
        <div class="dropdown-content">
            <a href="index.html">Home</a>
            <a href="listapersonaggi.html">Personaggi</a>
            <a href="manuale_utente.pdf" target="_blank">Manuale Utente</a>
        </div>
    </div>
</nav>

<!-- Contenuto principale -->
<div class="app">
    
    <div id="startScreen">
        <div class="hero-section">
            <div class="main-robot">
                <img src="../img/genio.png" alt="Genio STEAM">
            </div>
            <h1>STEAM WHO?</h1>
            <p class="subtitle">
                Pensa a un grande personaggio della scienza, della tecnologia o della matematica e io proverò a indovinarlo!
            </p>
            <button id="startBtn">Inizia il gioco</button>
        </div>
    </div>

    <!-- Schermata di gioco -->
    <div id="gameScreen" style="display:none;">
        <div class="progress"><div id="progressBar"></div></div>
        
        <div class="card">
            <div class="main-robot">
                <img src="../img/genio.png" id="gameGenio" alt="Genio di Gioco">
            </div>

            <div class="confidence">
                <div id="confidenceBar"></div>
            </div>

            <div id="thinking">Sto pensando...</div>

            <p id="question"></p>

            <div class="buttons">
                <button id="yesBtn">SI</button>
                <button id="noBtn">NO</button>
            </div>

            <p id="result"></p>

            <button id="restartBtn">Ricomincia</button>
        </div>
    </div>
</div>

<script src="../javascript/script.js"></script>
</body>
</html>
