<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<title>STEAM Who?</title>

<link rel="stylesheet" href="../css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="background"></div>

<div class="game">

<h1>STEAM WHO?</h1>

<p class="subtitle">
Pensa ad uno scienziato STEAM.
Io proverò ad indovinarlo.
</p>

<div class="progress">
<div id="progressBar"></div>
</div>

<div class="card">

<div id="thinking" class="thinking">🤖 Sto pensando...</div>

<p id="question"></p>

<div class="buttons">

<button id="yesBtn">✔ Sì</button>
<button id="noBtn">✖ No</button>

</div>

<p id="result"></p>

<button id="restartBtn">Gioca di nuovo</button>

</div>

</div>

<script src="../javascript/script.js"></script>

</body>
</html>
