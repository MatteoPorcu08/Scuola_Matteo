<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<title>STEAM Who?</title>

<link rel="stylesheet" href="../css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body>

<canvas id="particles"></canvas>

<!-- ===== NAVBAR ===== -->
<div class="navbar">

    <div class="logo">STEAM WHO?</div>

    <div class="menu">
        <button class="menu-btn">☰ Menu</button>

        <div class="dropdown">
            <a href="index.html">🏠 Home</a>
            <a href="listapersonaggi.html">👨‍🔬 Personaggi</a>
            <a href="../manuale.pdf" target="_blank">📘 Manuale</a>
        </div>
    </div>

</div>

<div class="app">

    <!-- ===== HOME ===== -->
    <div id="home">

        <h1>STEAM WHO?</h1>

        <p class="subtitle">
            Pensa ad un personaggio e prova il gioco!
        </p>

        <button id="startBtn">Inizia il gioco</button>

    </div>

    <!-- ===== GIOCO ===== -->
    <div id="gameScreen" style="display:none;">

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <div class="card">

            <div class="avatar">🤖</div>

            <div class="confidence">
                <div id="confidenceBar"></div>
            </div>

            <div id="thinking">Sto pensando...</div>

            <p id="question"></p>

            <div class="buttons">
                <button id="yesBtn">SI</button>
                <button id="noBtn">NO</button>
            </div>

            <p id="result"></p>

            <button id="restartBtn">Ricomincia</button>

        </div>

    </div>

</div>

<script src="../javascript/script.js"></script>

<script>
/* mostra gioco */
document.getElementById("startBtn").onclick = () => {
    document.getElementById("home").style.display="none"
    document.getElementById("gameScreen").style.display="block"
    startGame()
}
</script>

</body>
</html>
