<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Button</title>
    <script src="script.js"></script>
</head>
<body>
    <input type="radio" name="lang" value="C"> C
    <input type="radio" name="lang" value="C++"> C++
    <input type="radio" name="lang" value="Java "> Java
    //come salvare la scelta dai radio button e check box
    <input type="button" value="salva" onclick="salva()">
    <br><br><br>
    <input type="checkbox" name="lang2" value="C"> C
    <input type="checkbox" name="lang2" value="C++"> C++
    <input type="checkbox" name="lang2" value="Java "> Java //come salvare la scelta dai radio button e check box 
    <input type="button" value="salva2" onclick="salva2()">
</body>
</html>
