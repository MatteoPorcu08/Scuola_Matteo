<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestione Dati</title>
</head>
<body>

<h1>Gestione Dati</h1>

<p id="output"></p>
<p id="messaggio"></p>

<button onclick="aggiungi()">Aggiungi</button>
<button onclick="cerca()">Cerca</button>
<button onclick="elimina()">Elimina</button>
<button onclick="visualizza()">Visualizza</button>

<script>

// ===== ARRAY =====
let array1 = [];
let array2 = [];
let array3 = [];

let i = 0;

// ===== AGGIUNTA =====
function aggiungi() {
    let valore1 = prompt("Inserisci nome");
    let valore2 = prompt("Inserisci numero") * 1;
    let valore3 = prompt("Inserisci quantità") * 1;

    if (valore1 === "" || isNaN(valore2) || isNaN(valore3)) {
        alert("Errore nei dati");
        return;
    }

    array1[i] = valore1;
    array2[i] = valore2;
    array3[i] = valore3;

    i++;

    alert("Elemento inserito correttamente");
}

// ===== RICERCA =====
function ricerca(valore) {
    for (let j = 0; j < array1.length; j++) {
        if (array1[j] == valore) {
            return j;
        }
    }
    return -1;
}

// ===== CERCA =====
function cerca() {
    let valore = prompt("Cosa cerchi?");
    let risultato = ricerca(valore);

    if (risultato == -1) {
        document.getElementById("messaggio").innerHTML = "Elemento non trovato";
    } else {
        document.getElementById("messaggio").innerHTML =
            array1[risultato] + " - " +
            array2[risultato] + " x " +
            array3[risultato];
    }
}

// ===== ELIMINA =====
function elimina() {
    let valore = prompt("Cosa vuoi eliminare?");
    let risultato = ricerca(valore);

    if (risultato == -1) {
        alert("Elemento non trovato");
    } else {
        array1.splice(risultato, 1);
        array2.splice(risultato, 1);
        array3.splice(risultato, 1);

        alert("Elemento eliminato");
        visualizza();
    }
}

// ===== VISUALIZZA =====
function visualizza() {
    let output = document.getElementById("output");

    if (array1.length === 0) {
        output.innerHTML = "Nessun elemento presente";
        return;
    }

    output.innerHTML = "";

    for (let j = 0; j < array1.length; j++) {
        let totale = array2[j] * array3[j];

        output.innerHTML +=
            j + " - " +
            array1[j] + " " +
            array2[j] + " x " +
            array3[j] + " = " +
            totale + "<br>";
    }
}

</script>

</body>
</html>
