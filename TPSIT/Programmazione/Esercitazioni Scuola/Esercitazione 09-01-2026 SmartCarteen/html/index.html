<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCarteen</title>
    <script src="../javascript/script.js"></script>
</head>
<body>
    <h1>SmartCarteen</h1>
    <br>
    <h3>Aggiungi piatto</h3>
    <br>
    <input type="text" id="nomePiatto" placeholder="Nome Piatto">
    <input type="text" id="categoria" placeholder="Categoria">
    <input type="number" id="prezzoPiatto" placeholder="Prezzo">
    <input type="button" value="Aggiungi piatto" onclick="aggiungiPiatto()">
    <br>
    <h3>Menu del giorno</h3>
    <p id="menuDelGiorno"></p>
    <input type="button" value="Svuota Menu" onclick="svuotaMenu()">
    <hr>
    <h3>Prezzi</h3>
    <input type="button" value="Proponi Sconto" onclick="proponiSconto()">
    <input type="button" value="Anulla Sconto" onclick="annullaSconto()">
    <h4>Totale: <span id="totale">0.00</span></h4>
    <p>Sconto Proposto <span id="scontoProposto">0.00%</span></p>
</body>
</html>
