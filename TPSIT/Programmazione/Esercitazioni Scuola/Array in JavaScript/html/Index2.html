<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrey con form</title>
</head>
<script>
    var nome=new Array();
    var cognome=new Array();
    var i=0;
    function Invio() {
        nome[i]=f1.N.value;
        cognome[i]=f1.C.value;
        i++;
        f1.N.value="";
        f1.C.value="";
    }
    function Stampa() {
        document.write("<table border=1>");
            for(j=0; j<i; j++) {
                document.write("<tr><td>"+nome[j]+"</td><td>"+cognome[j]+"</td></tr>");
            }
        document.write("/table");
    }
</script>
<body>
    <h1>Array con Form</h1>
    <form name="f1">
        Dati personali <br>
        Nome:&nbsp;<input type="text" name="N">&nbsp;
        Cognome:&nbsp;<input type="text" name="C">&nbsp;
        <input type="button" value="Aggiungi" onclick="Invio()">
        <input type="button" value="Stampa" onclick="Stampa()">
    </form>
</body>
</html>
