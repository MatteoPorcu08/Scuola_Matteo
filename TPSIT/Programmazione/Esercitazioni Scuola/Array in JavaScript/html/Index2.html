<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Array con Form</title>
</head>

<script>
    var nome = new Array();
    var cognome = new Array();
    var i = 0;

    function Invio() {
        nome[i] = f1.N.value;
        cognome[i] = f1.C.value;
        i++;

        f1.N.value = "";
        f1.C.value = "";
    }

    function Stampa() {
        document.write("<h2>Elenco persone</h2>");
        document.write("<table border='1'>");
        document.write("<tr><th>Nome</th><th>Cognome</th></tr>");

        for (var j = 0; j < i; j++) {
            document.write("<tr>");
            document.write("<td>" + nome[j] + "</td>");
            document.write("<td>" + cognome[j] + "</td>");
            document.write("</tr>");
        }

        document.write("</table>");
    }

    function Cerca() {
        var cerca = f1.CERCA.value;
        var trovato = false;

        document.write("<h2>Risultato ricerca</h2>");
        document.write("<table border='1'>");
        document.write("<tr><th>Nome</th><th>Cognome</th></tr>");

        for (var j = 0; j < i; j++) {
            if (cognome[j] == cerca) {
                document.write("<tr>");
                document.write("<td>" + nome[j] + "</td>");
                document.write("<td>" + cognome[j] + "</td>");
                document.write("</tr>");
                trovato = true;
            }
        }

        document.write("</table>");

        if (!trovato) {
            document.write("<p>Cognome non trovato</p>");
        }
    }
</script>

<body>
    <h1>Array con Form</h1>

    <form name="f1">
        <h3>Dati personali</h3>

        Nome:
        <input type="text" name="N">

        Cognome:
        <input type="text" name="C">

        <br><br>

        <input type="button" value="Aggiungi" onclick="Invio()">
        <input type="button" value="Stampa" onclick="Stampa()">

        <br><br><br>

        Cerca Cognome:
        <input type="text" name="CERCA">
        <input type="button" value="Cerca" onclick="Cerca()">
    </form>
</body>
</html>
