<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Array con Form</title>
</head>

<script>
    var nome = new Array();
    var cognome = new Array();
    var i = 0;

    function Invio() {
        nome[i] = f1.N.value;
        cognome[i] = f1.C.value;
        i++;

        f1.N.value = "";
        f1.C.value = "";
    }

    function Stampa() {
        var output = "<h2>Elenco persone</h2>";
        output += "<table border='1'>";
        output += "<tr><th>Nome</th><th>Cognome</th></tr>";

        for (var j = 0; j < i; j++) {
            output += "<tr>";
            output += "<td>" + nome[j] + "</td>";
            output += "<td>" + cognome[j] + "</td>";
            output += "</tr>";
        }

        output += "</table>";

        document.getElementById("risultato").innerHTML = output;
    }

    function Cerca() {
        var cerca = f1.CERCA.value;
        var trovato = false;

        var output = "<h2>Risultato ricerca</h2>";
        output += "<table border='1'>";
        output += "<tr><th>Nome</th><th>Cognome</th></tr>";

        for (var j = 0; j < i; j++) {
            if (cognome[j] == cerca) {
                output += "<tr>";
                output += "<td>" + nome[j] + "</td>";
                output += "<td>" + cognome[j] + "</td>";
                output += "</tr>";
                trovato = true;
            }
        }

        output += "</table>";

        if (trovato == false) {
            output += "<p>Cognome non trovato</p>";
        }

        document.getElementById("risultato").innerHTML = output;
    }
</script>

<body>
    <h1>Array con Form</h1>

    <form name="f1">
        <h3>Dati personali</h3>

        Nome:
        <input type="text" name="N">

        Cognome:
        <input type="text" name="C">

        <br><br>

        <input type="button" value="Aggiungi" onclick="Invio()">
        <input type="button" value="Stampa" onclick="Stampa()">

        <br><br>

        Cerca Cognome:
        <input type="text" name="CERCA">
        <input type="button" value="Cerca" onclick="Cerca()">
    </form>

    <br><br>

    <!-- QUI SCRIVE SOTTO -->
    <div id="risultato"></div>

</body>
</html>
