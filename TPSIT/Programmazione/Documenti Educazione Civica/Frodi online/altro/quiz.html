<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quiz Frodi Online</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <nav class="navbar">

        <h1>Quiz Frodi Online</h1>

        <ul>

            <li>
                <a href="../web.html">Home</a>
            </li>

        </ul>

    </nav>

    <main class="quiz-page">

        <div class="quiz-container">

            <div class="quiz-box">

                <p id="questionNumber"
                   class="question-number">
                </p>

                <h2 id="question"
                    class="question">
                </h2>

                <div id="answers"
                     class="answers">
                </div>

                <p id="result"
                   class="result">
                </p>

                <button id="nextBtn"
                        class="btn">

                    Prossima domanda

                </button>

            </div>

            <div id="finalScore"
                 class="final-score">
            </div>

        </div>

    </main>

    <script src="javascript/quiz.js"></script>

</body>

</html>
