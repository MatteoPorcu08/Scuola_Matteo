<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Concessionaria</title>
</head>
<body>

    <h1>Gestione Concessionaria</h1>

    <!-- FORM 1: INSERIMENTO AUTO -->
    <h3>Aggiungi Auto</h3>
    <form action="concessionaria.php" method="POST">
        <input type="hidden" name="azione" value="inserisci">
        
        <label>Marca:</label><br>
        <input type="text" name="marca" required><br><br>
        
        <label>Modello:</label><br>
        <input type="text" name="modello" required><br><br>
        
        <label>Anno:</label><br>
        <input type="number" name="anno" required><br><br>
        
        <button type="submit">Salva Auto</button>
    </form>

    <hr>

    <!-- FORM 2: RICERCA VALORI -->
    <h3>Cerca Auto</h3>
    <form action="concessionaria.php" method="POST">
        <input type="hidden" name="azione" value="cerca">
        
        <label>Inserisci Marca o Anno:</label><br>
        <input type="text" name="chiave" required><br><br>
        
        <button type="submit">Cerca</button>
    </form>

</body>
</html>
